
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kamera Absensi SPPG</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 560px;
      margin: 24px auto;
      padding: 16px;
      background: #f3f7f4;
      color: #173c30;
    }
    main {
      background: white;
      padding: 20px;
      border-radius: 16px;
    }
    video, #hasil {
      display: block;
      width: 100%;
      border-radius: 12px;
      background: #17251f;
      margin: 16px 0;
    }
    button {
      padding: 12px 16px;
      margin: 4px 2px;
      border: 0;
      border-radius: 9px;
      background: #11665b;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #status { line-height: 1.5; overflow-wrap: anywhere; }
    .sembunyi { display: none !important; }
  </style>
</head>
<body>
<main>
  <h2>Kamera Absensi SPPG</h2>
  <p>Izinkan akses kamera untuk mengambil foto kehadiran.</p>

  <video id="video" autoplay playsinline></video>
  <canvas id="kanvas" class="sembunyi"></canvas>
  <img id="hasil" class="sembunyi" alt="Hasil foto">

  <button id="mulai">Aktifkan Kamera</button>
  <button id="ambil" disabled>Ambil Foto</button>
  <button id="ulang" class="sembunyi">Ulangi Foto</button>

  <p id="status">Kamera belum diaktifkan.</p>
</main>

<script>
  const video = document.getElementById('video');
  const kanvas = document.getElementById('kanvas');
  const hasil = document.getElementById('hasil');
  const mulai = document.getElementById('mulai');
  const ambil = document.getElementById('ambil');
  const ulang = document.getElementById('ulang');
  const status = document.getElementById('status');

  let stream = null;

  function matikanKamera() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }
    ambil.disabled = true;
  }

  async function aktifkanKamera() {
    matikanKamera();

    if (!window.isSecureContext ||
        !navigator.mediaDevices?.getUserMedia) {
      status.textContent =
        'Halaman tidak memiliki akses kamera yang aman. ' +
        'Buka situs GitHub Pages melalui HTTPS.';
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user' },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      video.classList.remove('sembunyi');
      hasil.classList.add('sembunyi');
      mulai.textContent = 'Kamera Aktif';
      ambil.disabled = false;
      ulang.classList.add('sembunyi');
      status.textContent = 'Kamera aktif. Silakan ambil foto.';
    } catch (error) {
      matikanKamera();
      status.textContent =
        'Kamera gagal dibuka: ' + error.message +
        '. Periksa izin kamera browser dan perangkat.';
    }
  }

  mulai.addEventListener('click', aktifkanKamera);

  ambil.addEventListener('click', () => {
    if (!stream || !video.videoWidth) {
      status.textContent = 'Tunggu sampai kamera siap.';
      return;
    }

    kanvas.width = video.videoWidth;
    kanvas.height = video.videoHeight;

    kanvas.getContext('2d').drawImage(
      video, 0, 0, kanvas.width, kanvas.height
    );

    hasil.src = kanvas.toDataURL('image/jpeg', 0.85);
    hasil.classList.remove('sembunyi');
    video.classList.add('sembunyi');

    matikanKamera();
    mulai.textContent = 'Aktifkan Kamera Lagi';
    ulang.classList.remove('sembunyi');
    status.textContent =
      'Foto berhasil diambil. Foto masih berada di halaman ini.';
  });

  ulang.addEventListener('click', aktifkanKamera);

  window.addEventListener('pagehide', matikanKamera);
  
/**
 * SPPG Bridge Client — tahap pengujian.
 * Tidak mengubah atau menerbitkan deployment produksi.
 */
const SPPG_BRIDGE_URL =
  'https://script.google.com/macros/s/AKfycby5huoXBrpeGTvmNz-8mFGn3PyT7BOyQNVyppByhro/dev?page=bridge';

// Isi setelah memeriksa event.origin dari Bridge di DevTools.
// Jangan gunakan '*' atau menerima origin sembarang.
const SPPG_BRIDGE_ORIGINS = new Set([
  // Contoh format: 'https://script.googleusercontent.com'
]);

const SPPG_METHODS = {
  login: 2,
  logout: 1,
  submitAttendance: 2,
  adminAddVolunteer: 2,
  adminSetActive: 3,
  adminUsers: 1,
  adminAttendance: 1
};

let sppgPopup = null;
let sppgBridgeOrigin = null;
let sppgReady = false;
let sppgRequestCounter = 0;
const sppgPending = new Map();

function sppgConnect() {
  if (sppgPopup && !sppgPopup.closed) {
    sppgPopup.focus();
    return Promise.reject(
      new Error('Popup Bridge sudah terbuka. Tunggu koneksi atau tutup popup lalu coba lagi.')
    );
  }

  sppgBridgeOrigin = null;
  sppgReady = false;

  // Panggil langsung dari klik pengguna agar tidak diblokir popup blocker.
  sppgPopup = window.open(
    SPPG_BRIDGE_URL,
    'SPPG_ABSENSI_BRIDGE',
    'popup,width=480,height=360'
  );

  if (!sppgPopup) {
    return Promise.reject(
      new Error('Popup diblokir. Izinkan popup untuk situs GitHub Pages ini.')
    );
  }

  return new Promise((resolve, reject) => {
    const started = Date.now();

    const poll = setInterval(() => {
      if (sppgReady) {
        clearInterval(poll);
        resolve(true);
      } else if (!sppgPopup || sppgPopup.closed) {
        clearInterval(poll);
        reject(new Error('Popup Bridge ditutup sebelum koneksi siap.'));
      } else if (Date.now() - started > 30000) {
        clearInterval(poll);
        reject(new Error(
          'Waktu koneksi habis. Periksa URL /dev, izin akses, dan origin Bridge.'
        ));
      }
    }, 250);
  });
}

window.addEventListener('message', event => {
  // Pesan wajib berasal dari popup yang dibuka halaman ini.
  if (!sppgPopup || event.source !== sppgPopup) return;

  // Jangan mempercayai origin yang belum ditetapkan secara eksplisit.
  if (!SPPG_BRIDGE_ORIGINS.has(event.origin)) {
    console.warn('Origin Bridge belum diizinkan:', event.origin);
    return;
  }

  const msg = event.data;
  if (!msg || msg.channel !== 'SPPG_BRIDGE_V1') return;

  if (!sppgBridgeOrigin) {
    // Kunci origin yang lolos allowlist.
    sppgBridgeOrigin = event.origin;
  } else if (event.origin !== sppgBridgeOrigin) {
    return;
  }

  if (msg.type === 'READY') {
    sppgReady = true;
    return;
  }

  if (msg.type !== 'RESULT' || typeof msg.id !== 'string') return;

  const request = sppgPending.get(msg.id);
  if (!request) return;

  sppgPending.delete(msg.id);
  clearTimeout(request.timeout);

  if (msg.ok) {
    request.resolve(msg.result);
  } else {
    request.reject(new Error(msg.error || 'Permintaan Bridge gagal.'));
  }
});

function sppgCall(fn, ...args) {
  if (!sppgReady || !sppgPopup || sppgPopup.closed) {
    return Promise.reject(new Error('Bridge belum tersambung.'));
  }

  if (!Object.prototype.hasOwnProperty.call(SPPG_METHODS, fn)) {
    return Promise.reject(new Error('Fungsi backend tidak diizinkan.'));
  }

  if (args.length !== SPPG_METHODS[fn]) {
    return Promise.reject(new Error('Jumlah parameter tidak sesuai.'));
  }

  const id = 'req_' + (++sppgRequestCounter) + '_' + Date.now();

  return new Promise((resolve, reject) => {
    const timeout = setTimeout(() => {
      sppgPending.delete(id);
      reject(new Error('Permintaan ke server melewati batas waktu.'));
    }, 60000);

    sppgPending.set(id, { resolve, reject, timeout });

    try {
      sppgPopup.postMessage({
        channel: 'SPPG_BRIDGE_V1',
        type: 'CALL',
        id,
        fn,
        args
      }, sppgBridgeOrigin);
    } catch (error) {
      clearTimeout(timeout);
      sppgPending.delete(id);
      reject(error);
    }
  });
}

function sppgDisconnect() {
  sppgReady = false;
  sppgBridgeOrigin = null;

  for (const [id, request] of sppgPending) {
    clearTimeout(request.timeout);
    request.reject(new Error('Koneksi Bridge ditutup.'));
    sppgPending.delete(id);
  }

  if (sppgPopup && !sppgPopup.closed) sppgPopup.close();
  sppgPopup = null;
}
</script>
</body>
</html>
