
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kamera Absensi SPPG</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 560px;
      margin: 24px auto;
      padding: 16px;
      background: #f3f7f4;
      color: #173c30;
    }
    main {
      background: white;
      padding: 20px;
      border-radius: 16px;
    }
    video, #hasil {
      display: block;
      width: 100%;
      border-radius: 12px;
      background: #17251f;
      margin: 16px 0;
    }
    button {
      padding: 12px 16px;
      margin: 4px 2px;
      border: 0;
      border-radius: 9px;
      background: #11665b;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #status { line-height: 1.5; overflow-wrap: anywhere; }
    .sembunyi { display: none !important; }
  </style>
</head>
<body>
<main>
  <h2>Kamera Absensi SPPG</h2>
  <p>Izinkan akses kamera untuk mengambil foto kehadiran.</p>

  <video id="video" autoplay playsinline></video>
  <canvas id="kanvas" class="sembunyi"></canvas>
  <img id="hasil" class="sembunyi" alt="Hasil foto">

  <button id="mulai">Aktifkan Kamera</button>
  <button id="ambil" disabled>Ambil Foto</button>
  <button id="ulang" class="sembunyi">Ulangi Foto</button>

  <p id="status">Kamera belum diaktifkan.</p>
</main>

<script>
  const video = document.getElementById('video');
  const kanvas = document.getElementById('kanvas');
  const hasil = document.getElementById('hasil');
  const mulai = document.getElementById('mulai');
  const ambil = document.getElementById('ambil');
  const ulang = document.getElementById('ulang');
  const status = document.getElementById('status');

  let stream = null;

  function matikanKamera() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }
    ambil.disabled = true;
  }

  async function aktifkanKamera() {
    matikanKamera();

    if (!window.isSecureContext ||
        !navigator.mediaDevices?.getUserMedia) {
      status.textContent =
        'Halaman tidak memiliki akses kamera yang aman. ' +
        'Buka situs GitHub Pages melalui HTTPS.';
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user' },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      video.classList.remove('sembunyi');
      hasil.classList.add('sembunyi');
      mulai.textContent = 'Kamera Aktif';
      ambil.disabled = false;
      ulang.classList.add('sembunyi');
      status.textContent = 'Kamera aktif. Silakan ambil foto.';
    } catch (error) {
      matikanKamera();
      status.textContent =
        'Kamera gagal dibuka: ' + error.message +
        '. Periksa izin kamera browser dan perangkat.';
    }
  }

  mulai.addEventListener('click', aktifkanKamera);

  ambil.addEventListener('click', () => {
    if (!stream || !video.videoWidth) {
      status.textContent = 'Tunggu sampai kamera siap.';
      return;
    }

    kanvas.width = video.videoWidth;
    kanvas.height = video.videoHeight;

    kanvas.getContext('2d').drawImage(
      video, 0, 0, kanvas.width, kanvas.height
    );

    hasil.src = kanvas.toDataURL('image/jpeg', 0.85);
    hasil.classList.remove('sembunyi');
    video.classList.add('sembunyi');

    matikanKamera();
    mulai.textContent = 'Aktifkan Kamera Lagi';
    ulang.classList.remove('sembunyi');
    status.textContent =
      'Foto berhasil diambil. Foto masih berada di halaman ini.';
  });

  ulang.addEventListener('click', aktifkanKamera);

  window.addEventListener('pagehide', matikanKamera);
</script>
</body>
</html>
